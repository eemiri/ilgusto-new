<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Gusto — Plate Reveal v3</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050505;
    color: #d0d0d0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 52px;
    mix-blend-mode: normal;
    transition: opacity 0.6s ease;
  }
  .nav.hidden { opacity: 0; pointer-events: none; }
  .nav-logo { font-family: Georgia, serif; font-style: italic; font-size: 20px; color: #c9a84c; }
  .nav-links { display: flex; gap: 36px; }
  .nav-links span { font-size: 9px; letter-spacing: 3px; color: #444; text-transform: uppercase; cursor: pointer; transition: color 0.3s; }
  .nav-links span:hover { color: #c9a84c; }

  /* ── HERO ── */
  .hero {
    padding: 130px 52px 60px;
    transition: opacity 0.6s ease;
  }
  .hero.hidden { opacity: 0; pointer-events: none; }
  .hero-eyebrow { font-size: 9px; letter-spacing: 6px; color: #c9a84c; text-transform: uppercase; margin-bottom: 18px; }
  .hero-hl {
    font-size: 52px; font-family: Georgia, serif; font-weight: 300; font-style: italic;
    color: #e8e0d0; line-height: 1.1; margin-bottom: 20px; letter-spacing: -1px;
  }
  .hero-rating { font-size: 11px; color: #3a3a3a; letter-spacing: 2px; }

  /* ── GALLERY ── */
  .gallery {
    padding: 20px 52px 100px;
    transition: opacity 0.6s ease;
  }
  .gallery.hidden { opacity: 0; pointer-events: none; }
  .g-label { font-size: 8px; letter-spacing: 5px; color: #222; text-transform: uppercase; margin-bottom: 52px; }

  .plates {
    display: flex;
    flex-wrap: wrap;
    gap: 44px 52px;
    align-items: flex-end;
  }

  .pw {
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Hover ring */
  .pw::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0);
    transition: border-color 0.5s ease, inset 0.5s ease;
    pointer-events: none;
  }
  .pw:hover::before { border-color: rgba(201,168,76,0.25); inset: -14px; }

  .plate {
    border-radius: 50%;
    display: block;
    box-shadow: 0 4px 28px rgba(0,0,0,0.55);
    transition: box-shadow 0.5s ease, transform 0.5s ease;
    position: relative;
    z-index: 1;
  }
  .pw:hover .plate {
    box-shadow: 0 10px 48px rgba(0,0,0,0.75);
    transform: translateY(-4px);
  }

  /* ── EXPAND LAYER ──
     A full-viewport div, clipped to circle(0 at X Y), expands to circle(200% at X Y).
     Inside it: the full dish reveal.
  */
  .expand-layer {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    clip-path: circle(0px at 50% 50%);
    transition: clip-path 0.75s cubic-bezier(0.76, 0, 0.24, 1);
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .expand-layer.open {
    clip-path: circle(150% at var(--cx) var(--cy));
    pointer-events: all;
  }
  .expand-layer.closing {
    clip-path: circle(0px at var(--cx) var(--cy));
  }

  /* Large plate inside expand layer */
  .expand-plate {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.4s 0.35s ease, transform 0.5s 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 20px 80px rgba(0,0,0,0.8);
  }
  .expand-layer.open .expand-plate {
    opacity: 1;
    transform: scale(1);
  }

  /* Text inside expand layer */
  .expand-text {
    position: absolute;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.45s 0.55s ease, transform 0.45s 0.55s ease;
    text-align: left;
    max-width: 320px;
  }
  .expand-layer.open .expand-text {
    opacity: 1;
    transform: translateY(0);
  }

  .et-cat { font-size: 9px; letter-spacing: 5px; color: #c9a84c; text-transform: uppercase; margin-bottom: 14px; }
  .et-name { font-size: 36px; font-family: Georgia, serif; font-style: italic; font-weight: 300; color: #e8e0d0; line-height: 1.15; margin-bottom: 14px; }
  .et-desc { font-size: 12px; color: #555; line-height: 1.9; margin-bottom: 22px; }
  .et-price { font-size: 18px; color: #c9a84c; font-family: Georgia, serif; letter-spacing: 1px; margin-bottom: 32px; }
  .et-close {
    font-size: 9px; letter-spacing: 4px; color: #333; text-transform: uppercase;
    cursor: pointer; transition: color 0.3s; display: inline-block; border-bottom: 1px solid #222;
    padding-bottom: 2px;
  }
  .et-close:hover { color: #888; border-bottom-color: #555; }

  /* Hint text in gallery */
  .hint { font-size: 10px; color: #2a2a2a; letter-spacing: 2px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<!-- EXPAND LAYER — the circle that opens from the plate -->
<div class="expand-layer" id="expandLayer">
  <div class="expand-plate" id="expandPlate"></div>
  <div class="expand-text" id="expandText">
    <div class="et-cat" id="etCat"></div>
    <div class="et-name" id="etName"></div>
    <div class="et-desc" id="etDesc"></div>
    <div class="et-price" id="etPrice"></div>
    <div class="et-close" onclick="closeReveal()">← zurück zur Küche</div>
  </div>
</div>

<!-- NAV -->
<nav class="nav" id="nav">
  <div class="nav-logo">Il Gusto</div>
  <div class="nav-links">
    <span>Speisekarte</span>
    <span>Galerie</span>
    <span>Reservieren</span>
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-eyebrow">Italian Fine Dining · Saarbrücken-Umland</div>
  <div class="hero-hl">Frisch.<br>Elegant.<br>Unvergesslich.</div>
  <div class="hero-rating">4,9 ★ &nbsp;·&nbsp; 144 Gäste haben gesprochen</div>
</section>

<!-- GALLERY -->
<section class="gallery" id="gallery">
  <div class="g-label">Unsere Küche</div>
  <div class="plates">

    <div class="pw" onclick="openReveal(this)">
      <div class="plate" style="width:155px;height:155px;
        background:radial-gradient(circle at 38% 42%,#f0e0c0 0%,#d4a870 32%,#8a5830 68%,#4a2810 100%)"
        data-cat="Hausgemachte Pasta"
        data-name="Ravioli di Vitello"
        data-desc="Kalbsfüllung · Süßkartoffelcreme<br>Demi-Glace · Microgreens"
        data-price="€ 18,90">
      </div>
    </div>

    <div class="pw" onclick="openReveal(this)" style="margin-bottom:24px">
      <div class="plate" style="width:195px;height:195px;
        background:radial-gradient(circle at 50% 45%,#f8f0e0 0%,#e0c890 22%,#c09060 52%,#784830 88%)"
        data-cat="Vorspeise"
        data-name="Carpaccio di Manzo"
        data-desc="Rinderfilet roh · Parmesanflocken<br>Rucola · Kirschtomaten · Trüffelöl"
        data-price="€ 21,50">
      </div>
    </div>

    <div class="pw" onclick="openReveal(this)">
      <div class="plate" style="width:135px;height:135px;
        background:radial-gradient(circle at 42% 50%,#dff0cc 0%,#88c060 28%,#4a7830 62%,#284818 100%)"
        data-cat="Pasta"
        data-name="Tagliatelle con Spinaci"
        data-desc="Spinat-Tagliatelle · Getrocknete Tomaten<br>Mandeln · Parmesan"
        data-price="€ 17,50">
      </div>
    </div>

    <div class="pw" onclick="openReveal(this)" style="margin-top:36px">
      <div class="plate" style="width:170px;height:170px;
        background:radial-gradient(circle at 44% 38%,#f5ead0 0%,#d8b068 26%,#c89850 48%,#8a6030 78%)"
        data-cat="Hausgemachte Pasta"
        data-name="Tortelloni al Salmone"
        data-desc="Lachscreme-Füllung · Zitronensoße<br>Mandelblättchen"
        data-price="€ 18,90">
      </div>
    </div>

    <div class="pw" onclick="openReveal(this)">
      <div class="plate" style="width:150px;height:150px;
        background:radial-gradient(circle at 46% 42%,#f0e8d8 0%,#d8b880 28%,#c09050 58%,#704020 92%)"
        data-cat="Hauptspeise"
        data-name="Bistecca di Manzo"
        data-desc="Argentinisches Roastbeef<br>Edelpilzcremesoße · Kartoffeln"
        data-price="€ 32,90">
      </div>
    </div>

    <div class="pw" onclick="openReveal(this)" style="margin-bottom:18px">
      <div class="plate" style="width:125px;height:125px;
        background:radial-gradient(circle at 40% 38%,#f8f4e8 0%,#ead0a0 24%,#b09050 54%,#806040 86%)"
        data-cat="Dessert"
        data-name="Tiramisu"
        data-desc="Hausgemacht · Mascarpone<br>Espresso · Amaretto"
        data-price="€ 8,00">
      </div>
    </div>

  </div>
  <div class="hint">Teller anklicken</div>
</section>

<script>
let isOpen = false;
let currentPlate = null;

function openReveal(wrapper) {
  if (isOpen) return;
  isOpen = true;
  currentPlate = wrapper;

  const plate = wrapper.querySelector('.plate');
  const rect = plate.getBoundingClientRect();

  // Center of clicked plate in viewport coords
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const layer = document.getElementById('expandLayer');

  // Set origin point for the clip-path expand
  layer.style.setProperty('--cx', cx + 'px');
  layer.style.setProperty('--cy', cy + 'px');
  layer.style.clipPath = `circle(0px at ${cx}px ${cy}px)`;

  // Position big plate centered-ish (left portion of screen)
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const bigSize = Math.min(vw * 0.36, vh * 0.58, 360);
  const bigLeft = vw * 0.07;
  const bigTop = (vh - bigSize) / 2;

  const ep = document.getElementById('expandPlate');
  ep.style.width = bigSize + 'px';
  ep.style.height = bigSize + 'px';
  ep.style.left = bigLeft + 'px';
  ep.style.top = bigTop + 'px';
  ep.style.background = plate.style.background;

  // Position text
  const et = document.getElementById('expandText');
  et.style.left = (bigLeft + bigSize + 56) + 'px';
  et.style.top = (bigTop + 48) + 'px';

  // Fill text
  document.getElementById('etCat').textContent = plate.dataset.cat;
  document.getElementById('etName').textContent = plate.dataset.name;
  document.getElementById('etDesc').innerHTML = plate.dataset.desc;
  document.getElementById('etPrice').textContent = plate.dataset.price;

  // Dim surrounding UI
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('hero').classList.add('hidden');
  document.getElementById('gallery').classList.add('hidden');

  // Trigger expand — next frame so clip-path: 0 is painted first
  requestAnimationFrame(() => requestAnimationFrame(() => {
    layer.classList.add('open');
  }));
}

function closeReveal() {
  if (!isOpen) return;

  const layer = document.getElementById('expandLayer');

  // Get current origin (from CSS variable)
  const cx = layer.style.getPropertyValue('--cx');
  const cy = layer.style.getPropertyValue('--cy');

  // Remove open, add closing
  layer.classList.remove('open');
  layer.classList.add('closing');
  layer.style.clipPath = `circle(0px at ${cx} ${cy})`;

  // Un-dim UI
  document.getElementById('nav').classList.remove('hidden');
  document.getElementById('hero').classList.remove('hidden');
  document.getElementById('gallery').classList.remove('hidden');

  setTimeout(() => {
    layer.classList.remove('closing');
    isOpen = false;
    currentPlate = null;
  }, 800);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReveal(); });
</script>
</body>
</html>
